<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skiniify{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 font-sans">
    
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <nav class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-white hover:text-orange-500 transition">
                Skiniify 🔪
            </a>
            <div class="flex gap-4">
                <a href="/calculator" class="text-gray-300 hover:text-white px-4 py-2 rounded-lg transition">Calculator</a>
                <a href="/inventory" class="text-gray-300 hover:text-white px-4 py-2 rounded-lg transition">Inventory</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 py-8 mt-12 border-t border-gray-700">
        <div class="max-w-4xl mx-auto px-6 text-center text-gray-400">
            <p>© 2024 Skiniify — Built by Shii-000</p>
            <p class="mt-2 text-sm">Discord Community Coming Soon!</p>
        </div>
    </footer>

</body>
</html>
